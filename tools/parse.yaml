identity:
  name: parse
  author: intsig-textin
  label:
    en_US: Parse
    zh_Hans: 文档解析
    pt_BR: Parse
    ja_JP: パース
description:
  human:
    en_US: Document parsing tool that extracts structured content from various file formats (PDF, WORD, EXCEL, PPT, images, etc.)
    zh_Hans: 文档解析工具，从多种文件格式（PDF、WORD、EXCEL、PPT、图片等）中提取结构化内容
    pt_BR: Ferramenta de análise de documentos que extrai conteúdo estruturado de vários formatos de arquivo (PDF, WORD, EXCEL, PPT, imagens, etc.)
    ja_JP: さまざまなファイル形式（PDF、WORD、EXCEL、PPT、画像など）から構造化されたコンテンツを抽出するドキュメント解析ツール
  llm: A tool for parsing documents and extracting structured content from various file formats including PDF, WORD, EXCEL, PPT, and images.
parameters:
  - name: file
    type: file
    required: true
    label:
      en_US: File
      zh_Hans: 文件
      pt_BR: Arquivo
      ja_JP: ファイル
    human_description:
      en_US: The file to be parsed (supports PDF, WORD, EXCEL, PPT, images, etc.)
      zh_Hans: 需要解析的文件（支持 PDF、WORD、EXCEL、PPT、图片等多种格式）
      pt_BR: O arquivo a ser analisado (suporta PDF, WORD, EXCEL, PPT, imagens, etc.)
      ja_JP: 解析するファイル（PDF、WORD、EXCEL、PPT、画像などに対応）
    llm_description: The file to be parsed, supporting PDF, WORD, EXCEL, PPT, images and other formats
    form: llm

  - name: pdf_pwd
    type: string
    required: false
    label:
      en_US: PDF Password
      zh_Hans: PDF 密码
      pt_BR: Senha PDF
      ja_JP: PDF パスワード
    human_description:
      en_US: Password for encrypted PDF files
      zh_Hans: 加密 PDF 文件的密码
      pt_BR: Senha para arquivos PDF criptografados
      ja_JP: 暗号化された PDF ファイルのパスワード
    llm_description: Password for encrypted PDF files
    form: form

  - name: page_ranges
    type: string
    required: false
    label:
      en_US: Page Ranges
      zh_Hans: 页码范围
      pt_BR: Intervalos de Páginas
      ja_JP: ページ範囲
    human_description:
      en_US: Specify page ranges to parse (e.g., "1-2,3-4,5-10" for pages 1-2, 3-4, 5-10)
      zh_Hans: 指定要解析的页码范围（例如 "1-2,3-4,5-10" 表示解析第 1-2、3-4、5-10 页）
      pt_BR: "Especifique os intervalos de páginas para analisar (ex: \"1-2,3-4,5-10\" para páginas 1-2, 3-4, 5-10)"
      ja_JP: "解析するページ範囲を指定（例: \"1-2,3-4,5-10\" は 1-2、3-4、5-10 ページを解析）"
    llm_description: "Specify page ranges to parse, format: \"1-2\" for pages 1-2, \"1-2,3-4,5-10\" for multiple ranges"
    form: form
    placeholder:
      en_US: e.g., 1-2,3-4,5-10
      zh_Hans: 例如：1-2,3-4,5-10
      pt_BR: "ex: 1-2,3-4,5-10"
      ja_JP: "例: 1-2,3-4,5-10"

  - name: include_hierarchy
    type: boolean
    required: false
    default: true
    label:
      en_US: Include Hierarchy
      zh_Hans: 返回层级关系
      pt_BR: Incluir Hierarquia
      ja_JP: 階層を含む
    human_description:
      en_US: Whether to return element hierarchy and relationships (parent_id, children_ids, ref_element_id)
      zh_Hans: 是否返回元素间的层级与关联字段（parent_id、children_ids、ref_element_id）
      pt_BR: Se deve retornar hierarquia e relacionamentos de elementos
      ja_JP: 要素の階層と関係を返すかどうか
    llm_description: Whether to return element hierarchy and relationships including parent_id, children_ids, ref_element_id
    form: form

  - name: include_inline_objects
    type: boolean
    required: false
    default: false
    label:
      en_US: Include Inline Objects
      zh_Hans: 返回行内对象
      pt_BR: Incluir Objetos Inline
      ja_JP: インラインオブジェクトを含む
    human_description:
      en_US: Whether to return fine-grained inline objects (formulas, handwriting, checkboxes, etc.)
      zh_Hans: 是否返回细粒度对象（如公式、手写、复选框等）
      pt_BR: Se deve retornar objetos inline de granularidade fina
      ja_JP: 細粒度のインラインオブジェクトを返すかどうか
    llm_description: Whether to return fine-grained inline objects such as formulas, handwriting, checkboxes
    form: form

  - name: include_char_details
    type: boolean
    required: false
    default: false
    label:
      en_US: Include Character Details
      zh_Hans: 返回字符级详情
      pt_BR: Incluir Detalhes de Caracteres
      ja_JP: 文字詳細を含む
    human_description:
      en_US: Whether to return character-level details (coordinates, confidence, candidates)
      zh_Hans: 是否返回字符级详细信息（坐标、置信度、候选字）
      pt_BR: Se deve retornar detalhes no nível de caractere
      ja_JP: 文字レベルの詳細を返すかどうか
    llm_description: Whether to return character-level details including coordinates, confidence, and candidates
    form: form

  - name: include_image_data
    type: boolean
    required: false
    default: false
    label:
      en_US: Include Image Data
      zh_Hans: 返回图片数据
      pt_BR: Incluir Dados de Imagem
      ja_JP: 画像データを含む
    human_description:
      en_US: Whether to return image data (image_url, mime_type, base64)
      zh_Hans: 是否返回图片数据（image_url、mime_type、base64）
      pt_BR: Se deve retornar dados de imagem
      ja_JP: 画像データを返すかどうか
    llm_description: Whether to return image data including image_url, mime_type, and base64
    form: form

  - name: include_table_structure
    type: boolean
    required: false
    default: false
    label:
      en_US: Include Table Structure
      zh_Hans: 返回表格结构
      pt_BR: Incluir Estrutura de Tabela
      ja_JP: テーブル構造を含む
    human_description:
      en_US: Whether to return detailed table structure (rows, cols, cells with coordinates)
      zh_Hans: 是否返回表格的详细结构化信息（行、列、单元格及坐标）
      pt_BR: Se deve retornar estrutura detalhada de tabelas
      ja_JP: 詳細なテーブル構造を返すかどうか
    llm_description: Whether to return detailed table structure in JSON format
    form: form

  - name: pages
    type: boolean
    required: false
    default: false
    label:
      en_US: Return Pages Info
      zh_Hans: 返回页面信息
      pt_BR: Retornar Informações de Páginas
      ja_JP: ページ情報を返す
    human_description:
      en_US: Whether to return page metadata list (page_number, dimensions, page_image_url, element_ids)
      zh_Hans: 是否返回页面元信息列表（页码、尺寸、渲染图地址、元素列表等）
      pt_BR: Se deve retornar lista de metadados de páginas
      ja_JP: ページメタデータリストを返すかどうか
    llm_description: Whether to return page metadata list including page dimensions, page_image_url, and element_ids
    form: form

  - name: title_tree
    type: boolean
    required: false
    default: false
    label:
      en_US: Return Title Tree
      zh_Hans: 返回标题树
      pt_BR: Retornar Árvore de Títulos
      ja_JP: タイトルツリーを返す
    human_description:
      en_US: Whether to return document outline/table of contents
      zh_Hans: 是否返回标题树（目录）
      pt_BR: Se deve retornar esboço do documento/sumário
      ja_JP: ドキュメントアウトライン/目次を返すかどうか
    llm_description: Whether to return hierarchical title tree (table of contents)
    form: form

  - name: table_view
    type: select
    required: false
    default: html
    label:
      en_US: Table View Format
      zh_Hans: 表格格式
      pt_BR: Formato de Visualização de Tabela
      ja_JP: テーブル表示形式
    human_description:
      en_US: Format of tables in markdown output
      zh_Hans: Markdown 中表格的表达格式
      pt_BR: Formato das tabelas na saída markdown
      ja_JP: Markdown 出力のテーブル形式
    llm_description: Format of tables in markdown output, either markdown or html
    form: form
    options:
      - value: markdown
        label:
          en_US: Markdown
          zh_Hans: Markdown
          pt_BR: Markdown
          ja_JP: Markdown
      - value: html
        label:
          en_US: HTML
          zh_Hans: HTML
          pt_BR: HTML
          ja_JP: HTML

output_schema:
  type: object
  properties:
    elements:
      type: array
      items:
        type: object
      description: The structured elements extracted from the file
    pages:
      type: array
      items:
        type: object
      description: The page metadata list (if pages capability is enabled)
    title_tree:
      type: array
      items:
        type: object
      description: The hierarchical title tree (if title_tree capability is enabled)
    images:
      type: array
      items:
        type: object
      description: The images extracted and uploaded to Dify (if include_image_data is enabled)

extra:
  python:
    source: tools/parse.py
